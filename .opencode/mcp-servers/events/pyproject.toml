[project]
name = "opensec-events-mcp"
version = "0.2.0"
description = "Events MCP server with Graphiti backend for episodic memory"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "graphiti-core>=0.29",
]

[tool.opensecurity]
# 运行时元数据，供 detect_env.py 和 mcp-manager.ts 读取
# import_names：检测时用 __import__(name)，已转换为 import 形式
# requires_docker：声明期望的 Docker 容器名；detect_env 只检测状态不启动，events/server.py lifespan 启动
import_names = ["mcp", "graphiti_core"]
requires_docker = "neo4j-events"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
