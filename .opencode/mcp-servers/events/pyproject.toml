[project]
name = "opensec-events-mcp"
version = "0.2.0"
description = "Events MCP server with Graphiti backend for episodic memory"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "graphiti-core>=0.29",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
