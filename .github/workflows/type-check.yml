name: type-check

# 静态检查门禁（真机裁决，非纸面结论）。
# 覆盖：
#   - backend pyright: control/backend 0 error / 0 warning（71 文件，六规则全 error）
#   - mcp pyright: mcp-servers 0 error / 0 warning（5 文件，同款配置）
#   - frontend: tsc --noEmit（strict）+ vitest 单测（utils/api/hooks 纯逻辑层）
# 依赖说明：pyright 类型解析需要第三方包在场（无依赖时 fastapi 等全部 Unknown，
# 会产生数百假 error）——安装清单与本地 venv 对齐; 平台专属包（pywin32=
# Windows-only、mlx/mlx_vlm=Apple-only）无法在 Linux 安装，其使用点均为
# 平台门控分支且已带行级 ignore。

on:
  push:
    paths:
      - ".opencode/control/backend/**/*.py"
      - ".opencode/control/backend/pyrightconfig.json"
      - ".opencode/mcp-servers/**/*.py"
      - ".opencode/mcp-servers/pyrightconfig.json"
      - ".opencode/control/frontend/src/**"
      - ".opencode/control/frontend/package.json"
      - ".opencode/control/frontend/package-lock.json"
      - ".opencode/control/frontend/tsconfig.json"
      - ".opencode/control/frontend/vitest.config.ts"
      - ".github/workflows/type-check.yml"
  pull_request:
    paths:
      - ".opencode/control/backend/**/*.py"
      - ".opencode/control/backend/pyrightconfig.json"
      - ".opencode/mcp-servers/**/*.py"
      - ".opencode/mcp-servers/pyrightconfig.json"
      - ".opencode/control/frontend/src/**"
  workflow_dispatch:

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ runner.os }}-v1
      - name: 安装依赖（类型解析用——钉版与本地 venv 一致，防版本漂移假 error）
        run: |
          python -m pip install --upgrade pip
          pip install \
            "anthropic==0.125.0" "fastapi==0.141.1" "uvicorn==0.53.0" "pydantic==2.13.5" \
            "httpx==0.28.1" "psutil==7.2.2" "numpy==2.5.3" "mcp==1.29.0" \
            "graphiti-core==0.30.2" "sentence-transformers==6.0.1" "transformers==5.17.0" \
            "torch==2.14.0" "huggingface-hub==1.31.0" "pillow==10.4.0" "py7zr==1.1.3" \
            "sqlite-vec==0.1.9" pytest
      - name: 安装 basedpyright（钉版）
        run: npm install -g basedpyright@1.39.9
      - name: backend 类型门禁（0/0）
        working-directory: .opencode/control/backend
        run: basedpyright --pythonpath "$(which python)"
      - name: mcp-servers 类型门禁（0/0）
        working-directory: .opencode/mcp-servers
        run: basedpyright --pythonpath "$(which python)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .opencode/control/frontend/package-lock.json
      - name: 安装依赖
        working-directory: .opencode/control/frontend
        run: npm ci
      - name: 类型检查（strict）
        working-directory: .opencode/control/frontend
        run: npx tsc --noEmit
      - name: 单元测试（vitest）
        working-directory: .opencode/control/frontend
        run: npx vitest run
